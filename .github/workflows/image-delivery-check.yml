name: Image delivery checks

on:
  pull_request:
    paths:
      - "assets/site.js"
      - "scripts/audit_image_delivery.py"
      - "tests/test_audit_image_delivery.py"
      - "docs/image-performance-plan.md"
      - ".github/workflows/image-delivery-check.yml"
  push:
    branches:
      - "perf/image-manifest-gated-startup"
    paths:
      - "assets/site.js"
      - "scripts/audit_image_delivery.py"
      - "tests/test_audit_image_delivery.py"
      - "docs/image-performance-plan.md"
      - ".github/workflows/image-delivery-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check JavaScript syntax
        run: node --check assets/site.js
      - name: Run image audit tests
        run: python -m unittest tests.test_audit_image_delivery
      - name: Audit current image manifest
        run: python scripts/audit_image_delivery.py
