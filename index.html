<title>یادمان | هیچ نامی نباید از یاد برود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/site.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "یادمان",
  "url": "https://sinavm.github.io/yademan/",
  "description": "یادمان نام‌ها و خاطره‌ها را زنده نگه می‌دارد. هیچ نامی نباید از یاد برود. تقدیم به تمام مادران داغدار.",
  "inLanguage": "fa-IR",
  "isAccessibleForFree": true
}
</script>
</head>
<body>
<main id="world" aria-label="یادمان">
<header id="memorial-heading">
  <h1>یادمان</h1>
  <p>هیچ نامی نباید از یاد برود</p>
  <span>تقدیم به تمام مادران داغدار</span>
</header>
<canvas id="universe" aria-label="کره یادبود نام‌ها"></canvas>
<div id="photo-field" aria-hidden="true"></div>
<section id="name-card" aria-live="polite"><img id="person-image" alt="" hidden><div class="person-copy"><span id="person-name"></span><div class="person-meta"><span id="person-age"></span><span id="person-place"></span><span id="person-date" hidden></span></div></div></section>
<button id="search-toggle" type="button" aria-label="جست‌وجوی نام‌ها" title="جست‌وجوی نام‌ها">⌕</button>
<div id="search-layer" aria-hidden="true">
<input id="search" type="search" autocomplete="off" spellcheck="false" aria-label="جست‌وجوی نام" placeholder="نام را فارسی یا انگلیسی بنویسید…">
<div id="results"></div>
</div>
<section id="music-controls" aria-label="پخش موسیقی یادمان">
  <div class="music-actions">
    <button id="music-prev" type="button" aria-label="قطعه قبلی" title="قطعه قبلی" disabled>‹</button>
    <button id="music-play" class="music-play" type="button" aria-label="پخش موسیقی" title="پخش موسیقی" disabled></button>
    <button id="music-next" type="button" aria-label="قطعه بعدی" title="قطعه بعدی" disabled>›</button>
  </div>
  <input id="music-progress" type="range" min="0" max="1000" value="0" step="1" aria-label="موقعیت پخش" disabled>
  <div class="music-time"><span id="music-current-time">۰:۰۰</span><span id="music-duration">۰:۰۰</span></div>
</section>
<div id="zoom-controls" aria-label="کنترل بزرگ‌نمایی"><button id="zoom-in" type="button" aria-label="بزرگ‌نمایی">+</button><span id="zoom-value">75%</span><button id="zoom-out" type="button" aria-label="کوچک‌نمایی">−</button><button id="zoom-reset" type="button" aria-label="بازگشت به اندازه اولیه" title="اندازه اولیه">↺</button></div>
<div id="load-state" role="status" aria-live="polite"><span class="loading-emblem" aria-hidden="true">✦</span><span class="loading-copy">نام‌ها را به خاطر می‌سپاریم</span></div>
</main>
<script type="module" src="./assets/site.js"></script>
</body>
</html>
